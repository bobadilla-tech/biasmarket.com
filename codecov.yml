coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    # Informational only: the floors in each vitest config are the gate.
    patch:
      default:
        informational: true

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto
        threshold: 1%
  individual_flags:
    - name: api
      paths:
        - apps/api
      carryforward: true
    - name: web
      paths:
        - apps/web
      carryforward: true
    - name: workers
      paths:
        - apps/workers
      carryforward: true
    - name: mobile
      paths:
        - apps/mobile
      carryforward: true
    - name: utils
      paths:
        - packages/utils
      carryforward: true
    - name: validation
      paths:
        - packages/validation
      carryforward: true
    - name: types
      paths:
        - packages/types
      carryforward: true
    - name: design-tokens
      paths:
        - packages/design-tokens
      carryforward: true

comment:
  layout: "flags, diff, files"
  require_changes: true
