name: biasmarket-dev

networks:
  stack:
    driver: bridge

services:
  db:
    image: postgres:18
    networks: [stack]
    env_file:
      - .env.example
      - path: .env.local
        required: false
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biasmarket -d biasmarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: barriostore-minio
    networks: [stack]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: creates the bucket and sets it public-read, then exits.
  # Safe to re-run on every `pnpm docker:dev` — both mc commands are
  # idempotent (--ignore-existing / re-applying the same anonymous policy).
  minio-init:
    image: minio/mc
    networks: [stack]
    restart: "no"
    environment:
      MC_HOST_local: http://admin:password123@minio:9000
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc mb --ignore-existing local/products && mc anonymous set download local/products && mc mb --ignore-existing local/logos && mc anonymous set download local/logos"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: dev
    networks: [stack]
    working_dir: /app
    env_file:
      - .env.example
      - path: .env.local
        required: false
    command: sh infra/docker/scripts/api-dev.sh
    volumes:
      - ../..:/app
      - api_root_node_modules:/app/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
      - api_db_node_modules:/app/packages/db/node_modules
      - api_i18n_node_modules:/app/packages/i18n/node_modules
      - api_types_node_modules:/app/packages/types/node_modules
      - api_utils_node_modules:/app/packages/utils/node_modules
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "/app/infra/docker/api-healthcheck.ts"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      target: dev
    networks: [stack]
    working_dir: /app
    env_file:
      - .env.example
      - path: .env.local
        required: false
    command: sh infra/docker/scripts/web-dev.sh
    volumes:
      - ../..:/app
      - web_root_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - web_i18n_node_modules:/app/packages/i18n/node_modules
      - web_types_node_modules:/app/packages/types/node_modules
      - web_ui_node_modules:/app/packages/ui/node_modules
      - web_next_cache:/app/apps/web/.next
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  minio_data:
  api_root_node_modules:
  api_app_node_modules:
  api_db_node_modules:
  api_i18n_node_modules:
  api_types_node_modules:
  api_utils_node_modules:
  web_root_node_modules:
  web_app_node_modules:
  web_i18n_node_modules:
  web_types_node_modules:
  web_ui_node_modules:
  web_next_cache:
