name: biasmarket

services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - redis_data:/data
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Not published to the host — only reachable inside the compose network,
    # same trust model as db/minio.
    expose:
      - "6379"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/app/infra/docker/api-healthcheck.ts"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  workers:
    build:
      context: ../..
      dockerfile: infra/docker/workers.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3002
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD",
        "node",
        "/app/infra/docker/api-healthcheck.ts",
        "3002",
        "/health",
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3001
    depends_on:
      api:
        condition: service_healthy

  minio:
    image: minio/minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Not published to the host — only reachable inside the compose network.
    # Public read access is exposed exclusively via Caddy (cdn.biasmarket.com),
    # the admin console (9001) is intentionally not routed anywhere.

  # One-shot: creates the buckets and sets public-read on products/logos,
  # then exits. Safe to re-run on every `pnpm docker:prod` — every mc command
  # is idempotent (--ignore-existing / re-applying the same anonymous
  # policy). S3_PAYMENT_BUCKET deliberately gets no anonymous policy — it
  # stays private, readable only through the API's authenticated endpoint.
  minio-init:
    image: minio/mc
    restart: "no"
    environment:
      - MC_HOST_local=http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@minio:9000
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc mb --ignore-existing local/${S3_BUCKET} && mc anonymous set download local/${S3_BUCKET} && mc mb --ignore-existing local/${S3_LOGO_BUCKET} && mc anonymous set download local/${S3_LOGO_BUCKET} && mc mb --ignore-existing local/${S3_PAYMENT_BUCKET}"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
      - web
      - minio
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
  minio_data:
  redis_data:
