appId: com.biasmarket.mobile
---
- launchApp:
    clearState: true
- openLink: biasmarket:///login?storeSlug=${STORE_SLUG}
- tapOn: "Store slug"
- inputText: ${STORE_SLUG}
- tapOn: "Phone"
- inputText: ${BUYER_PHONE}
- tapOn: "Password"
- inputText: ${BUYER_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- assertVisible: "Search"
- stopApp
- launchApp
- assertVisible: "Search"
- openLink: biasmarket:///store/${STORE_SLUG}/product/${PRODUCT_ID}
- assertVisible: ${PRODUCT_NAME}
- tapOn: "Add to cart"
- tapOn: "Cart (1)"
- tapOn: "Continue to checkout"
- assertVisible: "Checkout"
- tapOn: "Pickup"
- tapOn: ${PICKUP_LABEL}
- tapOn: ${PAYMENT_METHOD}
- tapOn: "Choose image"
- tapOn:
    point: "25%, 35%"
- tapOn: "Place order"
- assertVisible: "Order placed"
- tapOn: "View my order"
- assertVisible: "Products"
- assertVisible: "Private payment receipt"
