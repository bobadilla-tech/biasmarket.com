name: Mobile Maestro

on:
  push:
    branches: [mobile-release]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "scripts/ci/mobile-maestro.sh"
      - ".github/workflows/mobile-maestro.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buyer-golden-path:
    name: Browse, checkout, proof, order detail (staging)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: mobile-staging
    concurrency:
      group: mobile-maestro-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Maestro CLI
        env:
          MAESTRO_VERSION: cli-2.12.1
          MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
        run: bash scripts/ci/install-maestro.sh
      - name: Build staging APK
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN is required in mobile-staging" && exit 1)
          test -n "$EAS_PROJECT_ID" || (echo "EAS_PROJECT_ID is required in mobile-staging" && exit 1)
          build_json=$(pnpm --filter mobile exec eas build --platform android --profile preview --non-interactive --wait --json)
          build_id=$(jq -r '.[0].id // empty' <<< "$build_json")
          test -n "$build_id" || (echo "Failed to extract build ID from EAS build output" && exit 1)
          echo "id=$build_id" >> "$GITHUB_OUTPUT"
      - name: Configure KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          BUILD_ID: ${{ steps.build.outputs.id }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          STORE_SLUG: ${{ secrets.MAESTRO_STORE_SLUG }}
          PRODUCT_ID: ${{ secrets.MAESTRO_PRODUCT_ID }}
          PRODUCT_NAME: ${{ secrets.MAESTRO_PRODUCT_NAME }}
          BUYER_PHONE: ${{ secrets.MAESTRO_BUYER_PHONE }}
          BUYER_PASSWORD: ${{ secrets.MAESTRO_BUYER_PASSWORD }}
          PICKUP_LABEL: ${{ secrets.MAESTRO_PICKUP_LABEL }}
          PAYMENT_METHOD: ${{ secrets.MAESTRO_PAYMENT_METHOD }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: bash scripts/ci/mobile-maestro.sh
