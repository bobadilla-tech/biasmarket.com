name: Cleanup fallback

# Backstop for infra/vps/deploy.sh's own self-scheduled 30-minute old-color
# cleanup (see cmd_deploy's call to schedule_cleanup,
# lib/cleanup_schedule.sh) — closes the gap where that schedule is lost
# silently (a VPS reboot mid-window; see
# docs/plans/2026-08-10-server-side-cleanup-scheduling-plan.md decision 7).
# Runs deploy.sh --cleanup unconditionally on a low-frequency cron; cheap
# because cmd_cleanup is idempotent and safe to call at any time (decision
# 4 of that plan) — the overwhelming majority of runs are a no-op.
#
# No concurrency group: cmd_cleanup's own flock (deploy.sh's
# acquire_deploy_lock) already serializes any two overlapping invocations
# on the VPS side, so concurrent fallback runs (or a fallback run landing
# during an active deploy) are harmless — worst case is a wasted flock wait
# up to its own 300s timeout, not a correctness issue. GitHub's `schedule:`
# trigger is best-effort and can slip by platform load; "hourly" is a
# target interval, not a guaranteed SLA.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cleanup-fallback:
    name: Run deploy.sh --cleanup
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      # `uses: ./...` below resolves the composite action from the checked-
      # out workspace, so a checkout has to happen even though this job
      # doesn't otherwise need repo contents.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/deploy-ssh-setup
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          user: ${{ secrets.DEPLOY_SSH_USER }}
          known_hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          key_rsync: ${{ secrets.DEPLOY_SSH_KEY_RSYNC }}
          key_dispatch: ${{ secrets.DEPLOY_SSH_KEY_DISPATCH }}

      - name: Clean up the previous color, if any
        run: |
          ssh -i ~/.ssh/deploy_dispatch_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'deploy.sh --cleanup'
