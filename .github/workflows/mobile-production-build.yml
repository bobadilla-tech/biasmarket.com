name: Mobile production build

on:
  push:
    branches: [mobile-release]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/mobile-production-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build production binaries
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: mobile-production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate EAS credentials
        run: |
          test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN is required in mobile-production" && exit 1)
          test -n "$EAS_PROJECT_ID" || (echo "EAS_PROJECT_ID is required in mobile-production" && exit 1)
      - name: Build iOS and Android
        run: |
          npm install --global eas-cli
          cd apps/mobile
          eas build --platform all --profile production --non-interactive --wait
