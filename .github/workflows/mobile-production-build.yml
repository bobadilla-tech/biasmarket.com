name: Mobile production build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build production binaries
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 90
    environment: mobile-production
    concurrency:
      group: mobile-production-build
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check EAS credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN is required in mobile-production" && exit 1)
          test -n "$EAS_PROJECT_ID" || (echo "EAS_PROJECT_ID is required in mobile-production" && exit 1)
      - name: Build iOS and Android
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          build_json=$(pnpm --filter mobile exec eas build --platform all --profile production --non-interactive --wait --json)
          ios_build_id=$(jq -r '[.[] | select((.platform | ascii_downcase) == "ios") | .id] | if length == 1 then .[0] else empty end' <<< "$build_json")
          android_build_id=$(jq -r '[.[] | select((.platform | ascii_downcase) == "android") | .id] | if length == 1 then .[0] else empty end' <<< "$build_json")
          test -n "$ios_build_id" || (echo "Expected exactly one iOS build ID from EAS" && exit 1)
          test -n "$android_build_id" || (echo "Expected exactly one Android build ID from EAS" && exit 1)
          for build_id in "$ios_build_id" "$android_build_id"; do
            [[ "$build_id" =~ ^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$ ]] || (echo "EAS returned an invalid build ID" && exit 1)
          done
          echo "- iOS build: $ios_build_id" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android build: $android_build_id" >> "$GITHUB_STEP_SUMMARY"
