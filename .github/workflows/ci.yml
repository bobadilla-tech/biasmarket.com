name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".gitignore"
      - "*.md"
      - "**/*.md"
  # No `branches:` filter: stacked PRs (base != main) get the same CI.
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the API E2E job on this manual run"
        type: boolean
        default: false
  # merge_group is deliberately not wired. If a merge queue is enabled while
  # CI Success is required, add merge_group here first or the queue wedges.

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Turbo cache policy: main saves under `turbo-<job>-…-<sha>`, PR runs under
# `turbo-<job>-…-pr<N>-<sha>`. PR runs restore their own PR's newest cache
# first (fast re-pushes), then main's; main can never read PR caches (GitHub
# scopes caches by ref), and turbo only reuses outputs whose input hash
# matches, so a restored cache cannot make a build wrong. Entries older than
# 7 days are pruned before saving so the archive restored from the newest key
# stops growing forever. GitHub evicts least-recently-used caches first, so
# stale PR caches go before the pnpm/Playwright/E2E image caches that every
# run reads.

env:
  # Prettier changed-files gate (scripts/lint-changed-files.mjs) diffs against
  # the PR's own base, so a stacked PR is not re-flagged for lower PRs' files.
  BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
  TURBO_CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr{0}-', github.event.pull_request.number) || '' }}
  NODE_VERSION: "24"
  PNPM_VERSION: "10.11.0"

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      workers: ${{ steps.filter.outputs.workers }}
      db: ${{ steps.filter.outputs.db }}
      i18n: ${{ steps.filter.outputs.i18n }}
      queue: ${{ steps.filter.outputs.queue }}
      types: ${{ steps.filter.outputs.types }}
      design_tokens: ${{ steps.filter.outputs.design_tokens }}
      utils: ${{ steps.filter.outputs.utils }}
      validation: ${{ steps.filter.outputs.validation }}
      query: ${{ steps.filter.outputs.query }}
      mobile: ${{ steps.filter.outputs.mobile }}
      sanity: ${{ steps.filter.outputs.sanity }}
      web_e2e: ${{ steps.filter.outputs.web_e2e }}
      api_e2e: ${{ steps.filter.outputs.api_e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/db/**'
              - 'packages/i18n/**'
              - 'packages/queue/**'
              - 'packages/types/**'
              - 'packages/utils/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - 'eslint.config.mjs'
              - 'scripts/lint-changed-files.mjs'
            web:
              - 'apps/web/**'
              - 'packages/design-tokens/**'
              - 'packages/i18n/**'
              - 'packages/types/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - 'eslint.config.mjs'
              - 'scripts/lint-changed-files.mjs'
            workers:
              - 'apps/workers/**'
              - 'packages/queue/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - 'eslint.config.mjs'
              - 'scripts/lint-changed-files.mjs'
            db:
              - 'packages/db/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - 'eslint.config.mjs'
              - 'scripts/lint-changed-files.mjs'
            i18n:
              - 'packages/i18n/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - 'eslint.config.mjs'
              - 'scripts/lint-changed-files.mjs'
            queue:
              - 'packages/queue/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - 'eslint.config.mjs'
              - 'scripts/lint-changed-files.mjs'
            types:
              - 'packages/types/**'
              - 'apps/api/openapi.json'
              - 'scripts/ci/check-types-sdk-drift.sh'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - 'eslint.config.mjs'
              - 'scripts/lint-changed-files.mjs'
            design_tokens:
              - 'packages/design-tokens/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - 'eslint.config.mjs'
              - 'scripts/lint-changed-files.mjs'
            utils:
              - 'packages/utils/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - 'eslint.config.mjs'
              - 'scripts/lint-changed-files.mjs'
            validation:
              - 'packages/validation/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - 'eslint.config.mjs'
              - 'scripts/lint-changed-files.mjs'
            query:
              - 'packages/query/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - 'eslint.config.mjs'
              - 'scripts/lint-changed-files.mjs'
            mobile:
              - 'apps/mobile/**'
              - 'packages/design-tokens/**'
              - 'packages/i18n/**'
              - 'packages/query/**'
              - 'packages/types/**'
              - 'packages/validation/**'
              - 'packages/utils/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - 'eslint.config.mjs'
              - 'scripts/lint-changed-files.mjs'
            sanity:
              - 'apps/sanity/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - 'eslint.config.mjs'
              - 'scripts/lint-changed-files.mjs'
            # The a11y browser E2E job builds and runs BOTH apps plus the seed,
            # so it is sensitive to api/db/seed changes on top of everything the
            # `web` filter covers.
            web_e2e:
              - 'apps/web/**'
              - 'apps/api/scripts/seed/**'
              - 'packages/db/**'
              - 'scripts/ci/minio-e2e.sh'
              - 'scripts/ci/e2e-images.sh'
              - 'scripts/ci/e2e-datastores.sh'
              - 'scripts/ci/web-e2e.sh'
              - 'scripts/ci/load-e2e-env.sh'
              - 'scripts/ci/e2e.env.example'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
            # The API E2E suite builds and runs the API and workers against
            # Postgres, Redis, and MinIO, so run it when either app, its shared
            # runtime packages, the test harness, or its build configuration changes.
            api_e2e:
              - 'apps/api/**'
              - 'apps/workers/**'
              - 'packages/db/**'
              - 'packages/queue/**'
              - 'packages/types/**'
              - 'packages/utils/**'
              - 'scripts/ci/check-openapi-drift.sh'
              - 'scripts/ci/e2e.sh'
              - 'scripts/ci/e2e-datastores.sh'
              - 'scripts/ci/e2e-images.sh'
              - 'scripts/ci/e2e.env.example'
              - 'scripts/ci/load-e2e-env.sh'
              - 'scripts/ci/minio-e2e.sh'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'package.json'
              - '.github/workflows/ci.yml'

  api:
    name: API
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `lint-changed-files.mjs` diffs against origin/main; a shallow
          # checkout has no base ref, which would fail the lint step.
          fetch-depth: 0

      - name: Load shared CI test environment
        run: bash scripts/ci/load-e2e-env.sh

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        id: turbo-cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-api-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ env.TURBO_CACHE_SCOPE }}${{ github.sha }}
          restore-keys: |
            turbo-api-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ env.TURBO_CACHE_SCOPE }}
            turbo-api-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm turbo run lint --filter=api

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=api

      - name: Build
        run: pnpm turbo run build --filter=api

      - name: Check OpenAPI is tracked and up to date
        run: bash scripts/ci/check-openapi-drift.sh

      - name: Test with coverage
        run: pnpm --filter api test:cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage/lcov.info
          flags: api
          fail_ci_if_error: false

      # See "Turbo cache policy" at the top of this file.
      - name: Prune turbo cache
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        run: bash scripts/ci/prune-turbo-cache.sh

      - name: Save turbo cache
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

  web:
    name: Web
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `lint-changed-files.mjs` diffs against origin/main; a shallow
          # checkout has no base ref, which would fail the lint step.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        id: turbo-cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ env.TURBO_CACHE_SCOPE }}${{ github.sha }}
          restore-keys: |
            turbo-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ env.TURBO_CACHE_SCOPE }}
            turbo-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm turbo run lint --filter=web

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=web

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:3000"
        run: pnpm turbo run build --filter=web

      - name: Test with coverage
        run: pnpm --filter web test:cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/web/coverage/lcov.info
          flags: web
          fail_ci_if_error: false

      # See "Turbo cache policy" at the top of this file.
      - name: Prune turbo cache
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        run: bash scripts/ci/prune-turbo-cache.sh

      - name: Save turbo cache
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

  mobile:
    name: Mobile
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `lint-changed-files.mjs` diffs against the base branch; a shallow
          # checkout has no base ref, which would fail the lint step.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        id: turbo-cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-mobile-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ env.TURBO_CACHE_SCOPE }}${{ github.sha }}
          restore-keys: |
            turbo-mobile-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ env.TURBO_CACHE_SCOPE }}
            turbo-mobile-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm turbo run lint --filter=mobile

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=mobile

      - name: Test with coverage
        run: pnpm turbo run test:cov --filter=mobile

      - name: Check coverage report exists
        run: test -f apps/mobile/coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/mobile/coverage/lcov.info
          flags: mobile
          fail_ci_if_error: false

      # See "Turbo cache policy" at the top of this file.
      - name: Prune turbo cache
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        run: bash scripts/ci/prune-turbo-cache.sh

      - name: Save turbo cache
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

  workers:
    name: Workers
    needs: detect-changes
    if: needs.detect-changes.outputs.workers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `lint-changed-files.mjs` diffs against the base branch; a shallow
          # checkout has no base ref, which would fail the lint step.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        id: turbo-cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-workers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ env.TURBO_CACHE_SCOPE }}${{ github.sha }}
          restore-keys: |
            turbo-workers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ env.TURBO_CACHE_SCOPE }}
            turbo-workers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm turbo run lint --filter=workers

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=workers

      - name: Build
        run: pnpm turbo run build --filter=workers

      - name: Test with coverage
        run: pnpm --filter workers test:cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/workers/coverage/lcov.info
          flags: workers
          fail_ci_if_error: false

      # See "Turbo cache policy" at the top of this file.
      - name: Prune turbo cache
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        run: bash scripts/ci/prune-turbo-cache.sh

      - name: Save turbo cache
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

  db:
    name: DB (Prisma)
    needs: detect-changes
    if: needs.detect-changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `lint-changed-files.mjs` diffs against the base branch; a shallow
          # checkout has no base ref, which would fail the lint step.
          fetch-depth: 0

      - name: Load shared CI test environment
        run: bash scripts/ci/load-e2e-env.sh

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        id: turbo-cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-db-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ env.TURBO_CACHE_SCOPE }}${{ github.sha }}
          restore-keys: |
            turbo-db-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ env.TURBO_CACHE_SCOPE }}
            turbo-db-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build (prisma generate)
        run: pnpm turbo run build --filter=@biasmarket/db

      - name: Lint
        run: pnpm turbo run lint --filter=@biasmarket/db

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=@biasmarket/db

      # See "Turbo cache policy" at the top of this file.
      - name: Prune turbo cache
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        run: bash scripts/ci/prune-turbo-cache.sh

      - name: Save turbo cache
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

  migration-safety:
    name: Migration Safety
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Mirrors DESTRUCTIVE_PATTERN in infra/vps/lib/migrate.sh — deploy.sh
      # refuses any migration matching this without the manual-only
      # --i-understand-this-is-destructive flag (see that file and
      # docs/core/blue-green-migrations.md). Not wired into ci-success:
      # a destructive migration can be a legitimate, deliberate change
      # (see the expand/contract checklist) — this job's job is to make
      # sure the author sees that *before* merging, not to block the PR.
      - name: Check for destructive migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/check-destructive-migrations.sh

  i18n:
    name: i18n
    needs: detect-changes
    if: needs.detect-changes.outputs.i18n == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `lint-changed-files.mjs` diffs against the base branch; a shallow
          # checkout has no base ref, which would fail the lint step.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        id: turbo-cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-i18n-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ env.TURBO_CACHE_SCOPE }}${{ github.sha }}
          restore-keys: |
            turbo-i18n-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ env.TURBO_CACHE_SCOPE }}
            turbo-i18n-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm turbo run build --filter=@biasmarket/i18n

      - name: Lint
        run: pnpm turbo run lint --filter=@biasmarket/i18n

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=@biasmarket/i18n

      # See "Turbo cache policy" at the top of this file.
      - name: Prune turbo cache
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        run: bash scripts/ci/prune-turbo-cache.sh

      - name: Save turbo cache
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

  queue:
    name: Queue
    needs: detect-changes
    if: needs.detect-changes.outputs.queue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `lint-changed-files.mjs` diffs against the base branch; a shallow
          # checkout has no base ref, which would fail the lint step.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        id: turbo-cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
