  e2e:
    name: E2E (API)
    # Run on pushes to main, relevant pull request changes, and explicit
    # workflow_dispatch requests. The paths filter keeps unrelated automation
    # and documentation changes from starting the database-backed suite.
    # `inputs.run_e2e` is a boolean context value; do not use
    # `github.event.inputs.run_e2e`, whose string "false" is truthy. Keep the
    # event-name guard in front of the input read because `inputs` is null on
    # push and pull_request.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && needs.detect-changes.outputs.api_e2e == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e)
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never set continue-on-error here: a red E2E job must make the CI run red
    # so both CI Success and CD's workflow_run gate fail closed.
    # Postgres/Redis/MinIO are started by scripts/ci/e2e-datastores.sh and
    # minio-e2e.sh rather than `services:`: service-container pulls happen
    # before any step, retry for only a few seconds, and cannot be cached, so
    # a transient GHCR `toomanyrequests` used to fail the job outright.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load shared CI test environment
        run: bash scripts/ci/load-e2e-env.sh

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        id: turbo-cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ env.TURBO_CACHE_SCOPE }}${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ env.TURBO_CACHE_SCOPE }}
            turbo-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Restore E2E sidecar images
        id: e2e-images
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/biasmarket-e2e-images
          key: e2e-images-${{ runner.os }}-${{ hashFiles('scripts/ci/e2e-images.sh') }}

      # Only reached on a cache miss (first run after a digest bump, or after
      # cache eviction); pulls retry with minute-scale backoff.
      - name: Log in to GHCR for E2E sidecars
        if: steps.e2e-images.outputs.cache-hit != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull or load E2E sidecar images
        run: bash scripts/ci/e2e-images.sh prefetch

      # Saved immediately (not in the post-job hook) so a red test run still
      # warms the cache for the next one.
      - name: Save E2E sidecar images
        if: steps.e2e-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/biasmarket-e2e-images
          key: ${{ steps.e2e-images.outputs.cache-primary-key }}

      - name: Run API E2E suite
        run: bash scripts/ci/e2e.sh

      - name: Upload API E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-e2e-diagnostics-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: ignore
          path: |
            .ci/e2e-workers.log
            .ci/e2e-migrate.log
            .ci/e2e-minio.log
            .ci/e2e-openapi.log
            .ci/e2e-suite.log

      # See "Turbo cache policy" at the top of this file.
      - name: Prune turbo cache
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        run: bash scripts/ci/prune-turbo-cache.sh

      - name: Save turbo cache
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

  web-e2e:
    name: Web E2E (a11y)
    needs: detect-changes
    if: needs.detect-changes.outputs.web_e2e == 'true'
    runs-on: ubuntu-latest
    # Builds api + web, migrates + seeds, boots both servers, downloads a
    # browser, then runs the axe/keyboard smoke. Realistically +6–12 min over a
    # package job; keep headroom.
    timeout-minutes: 25
    # This job is a blocking PR gate (it is in `ci-success.needs`). Phase 7
    # adds route-specific marketing/onboarding axe coverage to the existing
    # keyboard smoke suite; authenticated dashboard coverage remains a
    # follow-up until CI has stable seeded sessions.
    # Sidecars are script-managed (see the E2E (API) job).
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load shared CI test environment
        run: bash scripts/ci/load-e2e-env.sh

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

