            turbo-web-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Restore E2E sidecar images
        id: e2e-images
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/biasmarket-e2e-images
          key: e2e-images-${{ runner.os }}-${{ hashFiles('scripts/ci/e2e-images.sh') }}

      # Only reached on a cache miss (first run after a digest bump, or after
      # cache eviction); pulls retry with minute-scale backoff.
      - name: Log in to GHCR for E2E sidecars
        if: steps.e2e-images.outputs.cache-hit != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull or load E2E sidecar images
        run: bash scripts/ci/e2e-images.sh prefetch

      # Saved immediately (not in the post-job hook) so a red test run still
      # warms the cache for the next one.
      - name: Save E2E sidecar images
        if: steps.e2e-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/biasmarket-e2e-images
          key: ${{ steps.e2e-images.outputs.cache-primary-key }}

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run web a11y E2E
        run: bash scripts/ci/web-e2e.sh

      - name: Upload Playwright + server diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-diagnostics-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            apps/web/playwright-report
            apps/web/test-results
            .ci/web-e2e-api.log
            .ci/web-e2e-web.log

      # See "Turbo cache policy" at the top of this file.
      - name: Prune turbo cache
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        run: bash scripts/ci/prune-turbo-cache.sh

      - name: Save turbo cache
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - api
      - web
      - mobile
      - workers
      - db
      - i18n
      - queue
      - types
      - design-tokens
      - utils
      - validation
      - query
      - sanity
      - hygiene
      - e2e
      - web-e2e
    if: always()
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check all required jobs
        # The required branch-protection check is this job's exact name,
        # `CI Success`. Renaming the key or name silently detaches that check.
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          API_RESULT: ${{ needs.api.result }}
          WEB_RESULT: ${{ needs.web.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
