name: Mobile production OTA update

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Release note for this JavaScript-only update"
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    name: Publish OTA update to production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 90
    environment: mobile-production
    concurrency:
      group: mobile-production-update
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Confirm OTA support is installed
        run: bash scripts/ci/check-mobile-ota-ready.sh
      - name: Publish JavaScript update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN is required in mobile-production" && exit 1)
          test -n "$EAS_PROJECT_ID" || (echo "EAS_PROJECT_ID is required in mobile-production" && exit 1)
          pnpm --filter mobile exec eas update --channel production --environment production --message "$UPDATE_MESSAGE" --non-interactive
