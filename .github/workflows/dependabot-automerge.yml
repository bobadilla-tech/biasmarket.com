name: Dependabot Auto Merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# Read by default. Only the auto-merge job writes.
permissions:
  contents: read

jobs:
  dependabot-auto-merge:
    name: Dependabot Auto Merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'dependabot/github_actions/')

    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0

      # Never automerge package-ecosystem github_actions. There is no
      # github-actions Dependabot config in this repo; this gate has to stay
      # in place before one is added. A cd.yml action bump that merged on a
      # green CI run would deploy that workflow without anyone reviewing the
      # deploy.
      #
      # Every other update type, majors included, still waits on the ruleset's
      # required CI check. Auto-merge does not skip it.
      #
      # The built-in token can never merge a PR that edits .github/workflows/*
      # ("refusing to allow a GitHub App to create or update workflow ... without workflows
      # permission"), which is what Dependabot's action-version bumps are. Those are left for a
      # human or the sweep tool instead of failing this job.
      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.package-ecosystem != '' &&
          steps.metadata.outputs.package-ecosystem != 'github_actions'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if gh pr diff "$PR_URL" --name-only | grep -q '^\.github/workflows/'; then
            echo "::notice::This PR edits workflow files, which the built-in token cannot merge. Merge it by hand."
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
