name: Mobile store submission

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Store to submit to"
        required: true
        type: choice
        options: [ios, android, all]
      ios_build_id:
        description: "EAS build ID for iOS (required for ios or all)"
        required: false
        type: string
      android_build_id:
        description: "EAS build ID for Android (required for android or all)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  submit-ios:
    name: Submit iOS production build
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: mobile-production
    concurrency:
      group: mobile-store-submit-ios
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Submit iOS production binary
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          IOS_BUILD_ID: ${{ inputs.ios_build_id }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN is required in mobile-production" && exit 1)
          test -n "$EAS_PROJECT_ID" || (echo "EAS_PROJECT_ID is required in mobile-production" && exit 1)
          test -n "$IOS_BUILD_ID" || (echo "ios_build_id is required when submitting to iOS" && exit 1)
          [[ "$IOS_BUILD_ID" =~ ^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$ ]] || (echo "ios_build_id must be a UUID" && exit 1)
          cd apps/mobile
          pnpm dlx eas-cli submit --platform ios --profile production --id "$IOS_BUILD_ID" --non-interactive

  submit-android:
    name: Submit Android production build
    if: inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: mobile-production
    concurrency:
      group: mobile-store-submit-android
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Submit Android production binary
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          ANDROID_BUILD_ID: ${{ inputs.android_build_id }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN is required in mobile-production" && exit 1)
          test -n "$EAS_PROJECT_ID" || (echo "EAS_PROJECT_ID is required in mobile-production" && exit 1)
          test -n "$ANDROID_BUILD_ID" || (echo "android_build_id is required when submitting to Android" && exit 1)
          [[ "$ANDROID_BUILD_ID" =~ ^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$ ]] || (echo "android_build_id must be a UUID" && exit 1)
          cd apps/mobile
          pnpm dlx eas-cli submit --platform android --profile production --id "$ANDROID_BUILD_ID" --non-interactive
