version = 1

# Test files are analyzed with test-appropriate rules (no anti-pattern or
# complexity noise on assertions/env cleanup).
test_patterns = [
  "**/*.spec.ts",
  "**/*.spec.tsx",
  "**/*.e2e-spec.ts",
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/__tests__/**",
]

# Generated/build artifacts DeepSource must never analyze.
exclude_patterns = [
  "packages/types/generated/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/.next/**",
  "**/coverage/**",
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  environment = ["nodejs"]
  dialect = "typescript"
  # Boot-time env-var validation is a flat checklist (see env.validation.ts);
  # there's nothing to refactor, so never raise cyclomatic-complexity issues.
  cyclomatic_complexity_threshold = "critical"

# Every infra/vps script is `#!/usr/bin/env bash` (uses [[ ]], =~,
# BASH_REMATCH, mapfile, arrays). Auto-detection defaults to POSIX sh and
# raises SC3010/SC3024 portability false positives — pin the dialect.
[[analyzers]]
name = "shell"
enabled = true

  [analyzers.meta]
  dialect = "bash"
